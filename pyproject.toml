[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codecollector"
version = "0.8.0"
description = "PoC for indexing, searching, contextualizing, and staging Python code changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "streamlit>=1.35",
  "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["codecollector*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
