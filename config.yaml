app:
  name: codecollector
  version: 0.10.3
index:
  overlay_dirname: .codecollector
workspace:
  root_dirname: .workspaces
runs:
  root_dirname: .runs
state:
  root_dirname: .state
logging:
  level: INFO
  format: '%(asctime)s | %(levelname)s | %(name)s | %(message)s'
ui:
  default_demo_project: demo_projects/sample_python_app
storage:
  backend: postgres
postgres:
  graph_connection: postgresql://postgres:postgres@localhost:5432/vector_db
  vector_connection: postgresql+psycopg://postgres:postgres@localhost:5432/vector_db
  schema: public
  collection_prefix: codecollector
embedding:
  provider: ollama
  timeout_sec: 420
  ollama:
    base_url: http://127.0.0.1:11434
    model: nomic-embed-text-v2-moe
    timeout_sec: 420
search:
  default_limit: 5
  vector_enabled: true
  vector_backend: pgvector
  vector_weight: 4.0
reference_library:
  dir: reference_library
  top_n: 2
  full_file_max_lines: 32
  vector_weight: 3.0
codegenerator:
  root_dir: ../codegenerator
  config_path: config.yaml
  python: python
  request_format: json
  include_full_file_for_non_symbol_targets: true
  include_full_file_for_generate_test: true
  generate_related_tests_max_items: 1
  generate_test_related_tests_max_items: 1
  repair_related_tests_max_items: 1
  generate_reference_max_items: 1
  generate_test_reference_max_items: 1
  repair_reference_max_items: 1
  test_generation_mode: always
  repair_enabled: true
  max_repair_attempts: 1
verification:
  run_ruff: false
  run_recommended_tests: true
  run_full_project_tests: false
