app:
  name: codecollector
  version: 0.10.3
index:
  overlay_dirname: .codecollector
workspace:
  root_dirname: .workspaces
runs:
  root_dirname: .runs
state:
  root_dirname: .state
logging:
  level: INFO
  format: '%(asctime)s | %(levelname)s | %(name)s | %(message)s'
ui:
  default_demo_project: demo_projects/sample_python_app
storage:
  backend: postgres
postgres:
  graph_connection: postgresql://postgres:postgres@localhost:5432/vector_db
  vector_connection: postgresql+psycopg://postgres:postgres@localhost:5432/vector_db
  schema: public
  collection_prefix: codecollector
embedding:
  provider: ollama
  timeout_sec: 420
  ollama:
    base_url: http://127.0.0.1:11434
    model: nomic-embed-text-v2-moe
    timeout_sec: 420
search:
  default_limit: 5
  vector_enabled: true
  vector_backend: pgvector
  vector_weight: 4.0
reference_library:
  dir: reference_library
  top_n: 2
  full_file_max_lines: 32
  vector_weight: 3.0
codegenerator:
  root_dir: ../codegenerator
  config_path: config.yaml
  python: python
  request_format: json
  include_reference_artifacts: false
  include_full_file_for_non_symbol_targets: true
  include_full_file_for_generate_test: true
  include_full_file_for_repair: true
  repair_full_file_chars: 6000
  generate_related_tests_max_items: 1
  generate_test_related_tests_max_items: 1
  repair_related_tests_max_items: 1
  generate_related_symbols_max_items: 4
  generate_related_symbol_chars: 700
  generate_test_related_symbols_max_items: 4
  generate_test_related_symbol_chars: 700
  repair_related_symbols_max_items: 4
  repair_related_symbol_chars: 700
  generate_reference_max_items: 0
  generate_test_reference_max_items: 0
  repair_reference_max_items: 0
  test_generation_mode: always
  repair_enabled: true
  max_repair_attempts: 1
  test_repair_enabled: true
verification:
  run_ruff: false
  run_recommended_tests: true
  run_full_project_tests: false
  known_call_return_types:
    QFileDialog.getOpenFileName:
      tuple_items:
        - str
        - str
    QFileDialog.getSaveFileName:
      tuple_items:
        - str
        - str
    QFileDialog.getOpenFileNames:
      tuple_items:
        - list
        - str
analysis:
  llm_assist:
    enabled: true
    base_url: "https://ollama.com"
    api_key: "690c1905bf5142119e9eac6f0a6ee992.31gfL8NrBTR2PCsnuR90va_M"
    model: "qwen3-coder-next"
    timeout_sec: 300
    think: false
    temperature: 0.0
    num_ctx: 32768
    num_predict: 4096 # 1200
    keep_alive: 0
    max_prompt_chars: 18000
    search_plan_max_prompt_chars: 20000
    rerank_max_prompt_chars: 20000
    rerank_soft_overflow_ratio: 1.02
    rerank_json_indent: 0
    rerank_drop_operation_definitions_on_overflow: true
    rerank_candidate_drop_fields:
      - module_docstring
      - knowledge_title
      - requirements
    rerank_candidate_keep_fields:
      - candidate_id
      - qualname
      - name
      - kind
      - file_path
      - parent_qualname
      - docstring
      - class_members
      - search_score
      - search_confidence
    rerank_emergency_min_candidate_cards: 4
    rerank_raw_preview_chars: 1200
    min_confidence_auto_operation: 0.65
    min_confidence_auto_recommend_target: 0.65
  prompts:
    dir: codecollector/prompts
    system_template: codecollector/prompts/analyze_system_template.txt
    search_plan_template: codecollector/prompts/analyze_search_plan_user_template.txt
    rerank_template: codecollector/prompts/analyze_candidate_rerank_user_template.txt
  recall:
    project_map_max_files: 10
    project_map_min_files: 4
    project_map_symbols_per_file: 12
    project_map_min_symbols_per_file: 4
    project_map_module_doc_chars: 140
    project_map_symbol_doc_chars: 90
    base_search_limit: 10
    max_search_plan_queries: 3
    max_recall_candidates: 12
  candidate_context:
    max_candidate_cards: 6
    min_candidate_cards: 4
    candidate_source_chars: 180
    candidate_source_min_chars: 80
    related_test_chars: 120
    related_test_min_chars: 40
    related_tests: 0
    siblings: 2
    min_siblings: 0
    sibling_doc_chars: 50
    module_doc_chars: 60
    relation_limit: 1
    search_reasons: 2
  result:
    max_candidates: 5

onboarding:
  knowledge:
    architecture_doc_names:
      - ARCHITECT.md
      - ARCHITECTURE.md
    architecture_enrichment_system_template: codecollector/prompts/knowledge_architect_enrichment_system_template.txt
    architecture_enrichment_template: codecollector/prompts/knowledge_architect_enrichment_user_template.txt
    architecture_enrichment_max_prompt_chars: 32000
    architecture_enrichment_soft_overflow_ratio: 1.10
    architecture_doc_max_chars: 18000
    architecture_doc_min_chars: 5000
    architecture_doc_min_ratio: 0.30
    architecture_enrichment_max_modules: 200
    architecture_enrichment_max_symbols: 500
    architecture_enrichment_docstring_chars: 160
    architecture_enrichment_json_indent: 0
    architecture_enrichment_num_predict: 4096
